<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9E08A"/>
      <stop offset="0.5" stop-color="#D9A93C"/>
      <stop offset="1" stop-color="#A9761C"/>
    </linearGradient>
    <path id="topArc" d="M 205,500 A 295 295 0 0 1 795,500"/>
    <path id="midArc" d="M 160,500 A 340 340 0 0 0 840,500"/>
    <path id="botArc" d="M 100,500 A 400 400 0 0 0 900,500"/>
  </defs>

  <!-- Badge -->
  <circle cx="500" cy="500" r="490" fill="url(#gold)"/>
  <circle cx="500" cy="500" r="470" fill="#0B0B0B"/>
  <circle cx="500" cy="500" r="455" fill="none" stroke="url(#gold)" stroke-width="3"/>

  <!-- Text -->
  <g font-family="Montserrat, 'Century Gothic', 'Avenir Next', Arial, sans-serif" fill="url(#gold)" text-anchor="middle">
    <text font-size="54" font-weight="600" letter-spacing="6">
      <textPath href="#topArc" startOffset="50%">BEAUTIFULLY BOLD HAIR</textPath>
    </text>
    <text font-size="56" font-weight="700" letter-spacing="7">
      <textPath href="#midArc" startOffset="50%">BE THE ENVY</textPath>
    </text>
    <text font-size="40" font-weight="600" letter-spacing="14">
      <textPath href="#botArc" startOffset="50%">★  NAIROBI  ★</textPath>
    </text>
  </g>

  <!-- Center emblem -->
  <circle cx="500" cy="500" r="232" fill="none" stroke="url(#gold)" stroke-width="9"/>

  <g transform="translate(500 500) scale(0.85) translate(-500 -500)"
     fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Script B monogram -->
    <g transform="translate(-35 0)" stroke-width="15">
      <path d="M 478,338 C 455,420 420,540 400,640 C 440,690 520,690 565,648"/>
      <path d="M 478,338 C 565,318 610,385 565,432 C 535,462 490,468 440,470"/>
      <path d="M 455,470 C 565,458 650,525 615,595 C 585,650 500,655 432,622"/>
      <path d="M 345,560 C 335,450 395,395 450,395" stroke-width="11"/>
      <path d="M 560,300 C 610,290 640,330 625,375" stroke-width="9"/>
    </g>

    <!-- Woman's profile -->
    <g stroke-width="8">
      <path d="M 640,350 C 655,410 695,440 720,490 L 700,505 C 706,522 708,538 702,552 C 695,575 685,590 655,602"/>
      <path d="M 655,605 C 640,650 640,690 660,730"/>
      <path d="M 612,300 C 655,320 668,365 655,410" stroke-width="7"/>
      <path d="M 655,445 C 670,440 685,441 697,450" stroke-width="6"/>
      <path d="M 650,430 C 665,424 682,424 695,432" stroke-width="5"/>
      <path d="M 640,640 C 600,660 600,720 640,775" stroke-width="7"/>
    </g>
  </g>
</svg>
